name: Build Dobby Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build unzip wget

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Verify NDK
        run: |
          echo "NDK path: $ANDROID_NDK_ROOT"
          ls $ANDROID_NDK_ROOT

      - name: Patch platform_builder.py - Add Ninja generator
        run: |
          python3 - << 'EOF'
          with open("scripts/platform_builder.py", "r") as f:
              content = f.read()
          content = content.replace(
              'f"-DCMAKE_SYSTEM_VERSION={android_api_level}"\n    ]',
              'f"-DCMAKE_SYSTEM_VERSION={android_api_level}",\n      "-GNinja"\n    ]'
          )
          with open("scripts/platform_builder.py", "w") as f:
              f.write(content)
          print("platform_builder.py patch OK")
          EOF

      - name: Patch closure_bridge_arm64.asm - Fix PAGE/PAGEOFF for Android ELF
        run: |
          python3 - << 'EOF'
          import os
          ASM_FILE = "source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm"
          
          if not os.path.exists(ASM_FILE):
              raise FileNotFoundError(f"File {ASM_FILE} tidak ditemukan!")

          with open(ASM_FILE, "r") as f:
              content = f.read()

          # Ganti 2 baris Mach-O syntax dengan ELF syntax yang kompatibel dengan Clang
          content = content.replace(
              "adrp TMP_REG_0, cdecl(common_closure_bridge_handler)@PAGE\n"
              "add TMP_REG_0, TMP_REG_0, cdecl(common_closure_bridge_handler)@PAGEOFF",
              "adrp TMP_REG_0, common_closure_bridge_handler\n"
              "add TMP_REG_0, TMP_REG_0, :lo12:common_closure_bridge_handler"
          )

          with open(ASM_FILE, "w") as f:
              f.write(content)

          # Verifikasi Patch
          with open(ASM_FILE, "r") as f:
              lines = f.readlines()
          print("=== Patch verification ===")
          for i, line in enumerate(lines, 1):
              if "lo12" in line or "PAGE" in line or "common_closure_bridge_handler" in line:
                  print(f"  {i}: {line.rstrip()}")

          # Pastikan tidak ada @PAGE yang tersisa
          remaining = [l for l in lines if "@PAGE" in l]
          if remaining:
              raise Exception(f"Patch GAGAL, masih ada @PAGE: {remaining}")
          else:
              print("Patch SUCCESS - tidak ada sintaks @PAGE yang tersisa")
          EOF

      - name: Build arm64-v8a
        run: |
          python3 scripts/platform_builder.py \
            --platform=android \
            --arch=arm64-v8a \
            --android_ndk_dir=$ANDROID_NDK_ROOT

      - name: Build x86_64
        run: |
          python3 scripts/platform_builder.py \
            --platform=android \
            --arch=x86_64 \
            --android_ndk_dir=$ANDROID_NDK_ROOT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android-64bit
          path: |
            build/android/arm64-v8a/
            build/android/x86_64/
