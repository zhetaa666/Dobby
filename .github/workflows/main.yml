name: Build Dobby Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build

      - name: Export NDK
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Build
        run: |
          python3 scripts/platform_builder.py --platform=android --arch=all

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android
          path: build/
