name: Build Dobby Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build make unzip wget

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Verify NDK
        run: |
          echo $ANDROID_NDK_ROOT
          ls $ANDROID_NDK_ROOT

      - name: Patch platform_builder.py
        run: |
          # Fix 1: API level 19 tidak didukung NDK r26d, minimum adalah 21
          sed -i 's/SYSTEM_VERSION=19/SYSTEM_VERSION=21/g' scripts/platform_builder.py
          # Fix 2: Tambahkan -GNinja agar CMake menggunakan ninja sebagai build tool
          sed -i 's/-DCMAKE_BUILD_TYPE=Release/-DCMAKE_BUILD_TYPE=Release -GNinja/g' scripts/platform_builder.py
          # Verifikasi patch berhasil
          grep -n "SYSTEM_VERSION\|GNinja" scripts/platform_builder.py

      - name: Build Dobby
        run: |
          python3 scripts/platform_builder.py \
            --platform=android \
            --arch=all \
            --android_ndk_dir=$ANDROID_NDK_ROOT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android
          path: build/
