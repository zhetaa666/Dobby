name: Build Dobby Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build make unzip wget

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Verify NDK
        run: |
          echo "NDK path: $ANDROID_NDK_ROOT"
          ls $ANDROID_NDK_ROOT

      - name: Patch platform_builder.py
        run: |
          python3 - << 'EOF'
          with open("scripts/platform_builder.py", "r") as f:
              content = f.read()

          # Fix 1: API level 19 tidak didukung NDK r26d (min API 21)
          # Baris asli: android_api_level = 19
          content = content.replace(
              "android_api_level = 19",
              "android_api_level = 21"
          )

          # Fix 2: Tambahkan -GNinja ke cmake_args agar CMake pakai ninja bukan make
          # Inject setelah baris -DCMAKE_SYSTEM_VERSION di AndroidPlatformBuilder
          content = content.replace(
              'f"-DCMAKE_SYSTEM_VERSION={android_api_level}"\n    ]',
              'f"-DCMAKE_SYSTEM_VERSION={android_api_level}",\n      "-GNinja"\n    ]'
          )

          with open("scripts/platform_builder.py", "w") as f:
              f.write(content)

          # Verifikasi
          with open("scripts/platform_builder.py", "r") as f:
              lines = f.readlines()
          print("=== Patch verification ===")
          for i, line in enumerate(lines, 1):
              if "android_api_level" in line or "GNinja" in line:
                  print(f"  Line {i}: {line.rstrip()}")
          EOF

      - name: Build Dobby
        run: |
          python3 scripts/platform_builder.py \
            --platform=android \
            --arch=all \
            --android_ndk_dir=$ANDROID_NDK_ROOT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android
          path: build/
