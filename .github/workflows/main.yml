name: Build Dobby Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build unzip wget

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Verify NDK
        run: |
          echo "NDK path: $ANDROID_NDK_ROOT"
          ls $ANDROID_NDK_ROOT

      - name: Patch platform_builder.py - Add Ninja generator
        run: |
          python3 - << 'EOF'
          with open("scripts/platform_builder.py", "r") as f:
              content = f.read()

          content = content.replace(
              'f"-DCMAKE_SYSTEM_VERSION={android_api_level}"\n    ]',
              'f"-DCMAKE_SYSTEM_VERSION={android_api_level}",\n      "-GNinja"\n    ]'
          )

          with open("scripts/platform_builder.py", "w") as f:
              f.write(content)

          print("=== platform_builder.py patch OK ===")
          EOF

      - name: Patch closure_bridge_arm64.asm - Fix macOS syntax for Android/ELF
        run: |
          ASM_FILE="source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm"
          echo "=== Before patch ==="
          grep -n "PAGE\|PAGEOFF\|adrp\|add x17" "$ASM_FILE" || true

          # Ganti @PAGE/@PAGEOFF (Mach-O/macOS) → :pg_hi21:/:lo12: (ELF/Android)
          sed -i 's/adrp \(x[0-9]*\), \(.*\)@PAGE/adrp \1, :pg_hi21:\2/g' "$ASM_FILE"
          sed -i 's/add \(x[0-9]*\), \(x[0-9]*\), \(.*\)@PAGEOFF/add \1, \2, :lo12:\3/g' "$ASM_FILE"

          echo "=== After patch ==="
          grep -n "pg_hi21\|lo12\|adrp\|add x17" "$ASM_FILE" || true

      - name: Build arm64-v8a
        run: |
          python3 scripts/platform_builder.py \
            --platform=android \
            --arch=arm64-v8a \
            --android_ndk_dir=$ANDROID_NDK_ROOT

      - name: Build x86_64
        run: |
          python3 scripts/platform_builder.py \
            --platform=android \
            --arch=x86_64 \
            --android_ndk_dir=$ANDROID_NDK_ROOT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android-64bit
          path: |
            build/android/arm64-v8a/
            build/android/x86_64/
