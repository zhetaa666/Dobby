name: Build Dobby Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build
        run: |
          python3 scripts/platform_builder.py --platform=android --arch=all

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android
          path: build/
