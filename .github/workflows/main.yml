name: Build Dobby Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build unzip wget

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Verify NDK
        run: |
          echo "NDK path: $ANDROID_NDK_ROOT"
          ls $ANDROID_NDK_ROOT

      - name: Patch platform_builder.py - Add Ninja generator
        run: |
          python3 - << 'EOF'
          with open("scripts/platform_builder.py", "r") as f:
              content = f.read()

          # Satu-satunya fix yang perlu: tambah -GNinja supaya CMake tidak pakai Unix Makefiles
          content = content.replace(
              'f"-DCMAKE_SYSTEM_VERSION={android_api_level}"\n    ]',
              'f"-DCMAKE_SYSTEM_VERSION={android_api_level}",\n      "-GNinja"\n    ]'
          )

          with open("scripts/platform_builder.py", "w") as f:
              f.write(content)

          with open("scripts/platform_builder.py", "r") as f:
              lines = f.readlines()
          print("=== Patch verification ===")
          for i, line in enumerate(lines, 1):
              if "GNinja" in line:
                  print(f"  Line {i}: {line.rstrip()}")
          EOF

      - name: Build arm64-v8a
        run: |
          python3 scripts/platform_builder.py \
            --platform=android \
            --arch=arm64-v8a \
            --android_ndk_dir=$ANDROID_NDK_ROOT

      - name: Build x86_64
        run: |
          python3 scripts/platform_builder.py \
            --platform=android \
            --arch=x86_64 \
            --android_ndk_dir=$ANDROID_NDK_ROOT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android-64bit
          path: |
            build/android/arm64-v8a/
            build/android/x86_64/
