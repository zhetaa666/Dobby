name: Build Dobby Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build make unzip wget

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Verify NDK
        run: |
          echo "NDK path: $ANDROID_NDK_ROOT"
          ls $ANDROID_NDK_ROOT

      - name: Patch platform_builder.py
        run: |
          python3 - << 'EOF'
          import re

          with open("scripts/platform_builder.py", "r") as f:
              content = f.read()

          # Fix 1: Replace hardcoded API level 19 → 21 (NDK r26d requires min API 21)
          content = re.sub(r'(SYSTEM_VERSION[=\s"\']+)19\b', r'\g<1>21', content)

          # Fix 2: Add -GNinja and CMAKE_MAKE_PROGRAM to cmake configure command
          # The script builds a cmake command string — inject Ninja generator
          content = content.replace(
              '"-DCMAKE_BUILD_TYPE=Release"',
              '"-DCMAKE_BUILD_TYPE=Release", "-GNinja", f"-DCMAKE_MAKE_PROGRAM={__import__(\'shutil\').which(\'ninja\')}"'
          )

          with open("scripts/platform_builder.py", "w") as f:
              f.write(content)

          print("=== Patch verification ===")
          for i, line in enumerate(content.splitlines(), 1):
              if "SYSTEM_VERSION" in line or "GNinja" in line or "MAKE_PROGRAM" in line:
                  print(f"  Line {i}: {line.strip()}")
          EOF

      - name: Build Dobby
        run: |
          python3 scripts/platform_builder.py \
            --platform=android \
            --arch=all \
            --android_ndk_dir=$ANDROID_NDK_ROOT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android
          path: build/
